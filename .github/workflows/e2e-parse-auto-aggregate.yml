name: e2e-parse-auto-aggregate

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: bench-data-writes
  cancel-in-progress: false

jobs:
  emit-benchmark-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Emit benchmark output to logs
        run: |
          cat <<'BENCH'
          goos: linux
          goarch: amd64
          cpu: synthetic
          BenchmarkHash/map-8       2000000  680 ns/op   32 B/op  1 allocs/op
          BenchmarkHash/robin-8     2000000  610 ns/op   24 B/op  1 allocs/op
          BENCH

  parse-auto:
    runs-on: ubuntu-latest
    needs: emit-benchmark-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe current-run logs APIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
          echo "GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
          echo "GITHUB_JOB=${GITHUB_JOB}"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | [.id,.name,.status,.conclusion] | @tsv'

          JOB_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq ".jobs[] | select(.name==\"${GITHUB_JOB}\") | .id" | head -n1 || true)"
          echo "resolved_job_id=${JOB_ID:-<none>}"

          if [ -n "${JOB_ID}" ]; then
            gh api -i "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" | head -n1
          fi

      - name: Parse from workflow logs (auto)
        id: parse
        uses: strawgate/o11ykit/octo11y/actions/parse-results@main-dist
        with:
          mode: auto
          format: go
          run-id: ${{ github.run_id }}-${{ github.run_attempt }}--auto
          github-token: ${{ github.token }}

      - name: Assert source mode
        run: |
          echo "source=${{ steps.parse.outputs.source }}"
          test "${{ steps.parse.outputs.source }}" = "auto"

      - name: Aggregate
        uses: strawgate/o11ykit/octo11y/actions/aggregate@main-dist
        with:
          github-token: ${{ github.token }}
