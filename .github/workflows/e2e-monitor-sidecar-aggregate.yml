name: e2e-monitor-sidecar-aggregate

on:
  workflow_dispatch:
    inputs:
      o11ykit-ref:
        description: "Ref from strawgate/o11ykit to test (branch, tag, or SHA)"
        required: false
        default: "codex/aggregate-sidecar-ingest"
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: bench-data-write-serialized
  cancel-in-progress: false

jobs:
  capture-monitor-sidecar:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.ids.outputs.run_id }}
    steps:
      - name: Checkout playground
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout o11ykit ref
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: strawgate/o11ykit
          ref: ${{ inputs.o11ykit-ref }}
          path: .o11ykit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build local monitor actions
        working-directory: .o11ykit/octo11y
        run: |
          npm ci
          npm run build -w packages/core
          npm run build -w packages/format
          npm run build -w actions/actions-common
          npm run build -w actions/monitor
          npm run build -w actions/emit-metric

      - name: Compute run id
        id: ids
        run: |
          echo "run_id=monitor-only-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Start monitor
        id: monitor
        uses: ./.o11ykit/octo11y/actions/monitor
        with:
          profile: ci
          scrape-interval: 2s
          metric-sets: cpu,memory,load,process
          run-id: ${{ steps.ids.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Emit benchmark-style custom metric over OTLP
        uses: ./.o11ykit/octo11y/actions/emit-metric
        with:
          otlp-http-endpoint: ${{ steps.monitor.outputs.otlp-http-endpoint }}
          name: monitor_story_score
          value: 73
          unit: points
          scenario: playground-monitor
          series: monitor-only
          direction: bigger_is_better
          role: outcome

      - name: Run synthetic workload
        run: |
          python - <<'PY'
          total = 0
          for i in range(3_000_000):
              total += (i * 7) % 11
          print("workload checksum", total)
          PY

  aggregate-and-verify:
    runs-on: ubuntu-latest
    needs: capture-monitor-sidecar
    steps:
      - name: Checkout playground
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout o11ykit ref
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: strawgate/o11ykit
          ref: ${{ inputs.o11ykit-ref }}
          path: .o11ykit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build local aggregate action
        working-directory: .o11ykit/octo11y
        run: |
          npm ci
          npm run build -w packages/core
          npm run build -w packages/format
          npm run build -w actions/actions-common
          npm run build -w actions/aggregate

      - name: Aggregate bench-data
        uses: ./.o11ykit/octo11y/actions/aggregate
        with:
          github-token: ${{ github.token }}

      - name: Verify sidecar and aggregate visibility
        env:
          RUN_ID: ${{ needs.capture-monitor-sidecar.outputs.run_id }}
        run: |
          set -euo pipefail

          git fetch origin bench-data:bench-data

          SIDE="data/runs/${RUN_ID}/telemetry.otlp.jsonl.gz"
          echo "checking ${SIDE}"
          git ls-tree -r --name-only bench-data | grep -Fx "${SIDE}"

          git show bench-data:data/index.json > index.json
          node -e '
            const fs = require("node:fs");
            const runId = process.env.RUN_ID;
            const index = JSON.parse(fs.readFileSync("index.json", "utf8"));
            const run = index.runs.find((entry) => entry.id === runId);
            if (!run) {
              throw new Error(`run ${runId} not found in data/index.json`);
            }
            const monitorMetrics = (run.metrics || []).filter((name) => String(name).startsWith("_monitor/"));
            if (monitorMetrics.length === 0) {
              throw new Error(`run ${runId} has no _monitor/ metrics in index`);
            }
            console.log(`run ${runId} monitor metric count: ${monitorMetrics.length}`);
            console.log(`sample metrics: ${monitorMetrics.slice(0, 8).join(", ")}`);
          '

      - name: Ergonomics summary
        run: |
          {
            echo "## Monitor-Only Ergonomics Trial"
            echo ""
            echo "- Setup path: \\`monitor\\` + optional \\`emit-metric\\` + \\`aggregate\\`"
            echo "- No parse/stash step required for sidecar visibility"
            echo "- No jitter/backoff glue required in workflow"
            echo ""
            echo "This run validated that monitor sidecar data is visible to aggregate/index views."
          } >> "$GITHUB_STEP_SUMMARY"
